[project]
name = "climax-api"
version = "0.1.0"
description = "FastAPI Backend for ClimaX Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.30",
    "geoalchemy2>=0.15.0",
    "asyncpg>=0.29.0",
    "shapely>=2.0.4",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
