services:
  # Database: PostgreSQL 16 + PostGIS extension
  postgres:
    image: postgis/postgis:16-3.4
    container_name: climax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: climax_user
      POSTGRES_PASSWORD: climax_dev_password
      POSTGRES_DB: climax_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/0001_initial_schema.sql:/docker-entrypoint-initdb.d/0001_initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climax_user -d climax_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend: FastAPI
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: climax-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - path: ../../.env
        required: false
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=climax_user
      - DB_PASSWORD=climax_dev_password
      - DB_NAME=climax_db
      - DATABASE_URL=postgresql+asyncpg://climax_user:climax_dev_password@postgres:5432/climax_db
      - DATABASE_SYNC_URL=postgresql+psycopg2://climax_user:climax_dev_password@postgres:5432/climax_db
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../services:/app/services
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    container_name: climax-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: climax-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@climax.local
      PGADMIN_DEFAULT_PASSWORD: climax_dev_password
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend: Next.js
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: climax-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    volumes:
      - ../../apps/web:/app/apps/web

volumes:
  postgres_data:
