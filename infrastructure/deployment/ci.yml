name: ClimaX CI Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate-scaffolding:
    name: Verify Architectural Hygiene & Scaffolding
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: climax_user
          POSTGRES_PASSWORD: climax_dev_password
          POSTGRES_DB: climax_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U climax_user -d climax_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://climax_user:climax_dev_password@localhost:5432/climax_db
      DATABASE_SYNC_URL: postgresql+psycopg2://climax_user:climax_dev_password@localhost:5432/climax_db
      RUN_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify migrations upgrade and downgrade
        run: |
          alembic -c infrastructure/database/alembic.ini upgrade head
          alembic -c infrastructure/database/alembic.ini downgrade -1
          alembic -c infrastructure/database/alembic.ini upgrade head

      - name: Python Linting with Ruff
        run: ruff check apps/api services

      - name: Verify Architecture Scaffolding
        run: python3 scripts/verify-scaffolding.py

      - name: Test API
        run: |
          pytest tests/ --cov=apps/api/services --cov-fail-under=80

  validate-frontend:
    name: Verify Web & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Typecheck Types Package
        run: npm --prefix packages/types run typecheck

      - name: Typecheck UI Package
        run: npm --prefix packages/ui run typecheck

      - name: Typecheck Utils Package
        run: npm --prefix packages/utils run typecheck
