# Google Cloud Pub/Sub Streaming Topics & Subscriptions Configuration
topics:
  - name: climax-sensor-ingest
    messageRetentionDuration: "604800s" # 7 days
    subscriptions:
      - name: climax-sensor-ingest-to-db-sub
        ackDeadlineSeconds: 30
      - name: climax-sensor-ingest-dlq
        ackDeadlineSeconds: 60

  - name: climax-citizen-reports
    messageRetentionDuration: "604800s"
    subscriptions:
      - name: climax-citizen-reports-sub
        ackDeadlineSeconds: 120

  - name: climax-ai-dispatch
    messageRetentionDuration: "604800s"
    subscriptions:
      - name: climax-ai-dispatch-sub
        ackDeadlineSeconds: 120

  - name: climax-alerts-dispatch
    messageRetentionDuration: "86400s" # 1 day
    subscriptions:
      - name: alert-fcm-push-sub
        ackDeadlineSeconds: 20
