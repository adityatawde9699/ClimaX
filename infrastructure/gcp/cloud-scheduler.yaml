# Apply with the GCP project selected. Authentication and service account binding
# are deployment-owned because they include project-specific identities.
jobs:
  - name: climax-earth-engine-raster-refresh
    schedule: "0 */6 * * *"
    timeZone: "UTC"
    httpTarget:
      uri: https://REPLACE_WITH_API_HOST/api/v1/internal/earth-engine/refresh
      httpMethod: POST
      oidcToken:
        serviceAccountEmail: REPLACE_WITH_SCHEDULER_SERVICE_ACCOUNT
