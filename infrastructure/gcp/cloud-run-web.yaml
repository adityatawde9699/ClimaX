apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: climax-web
  labels:
    cloud.googleapis.com/location: us-central1
    app: climax-platform
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 100
      timeoutSeconds: 60
      containers:
      - image: us-central1-docker.pkg.dev/climax-prod/climax-repo/web:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
