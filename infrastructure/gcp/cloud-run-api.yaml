apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: climax-api
  labels:
    cloud.googleapis.com/location: us-central1
    app: climax-platform
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/vpc-access-connector: projects/climax-prod/locations/us-central1/connectors/climax-vpc-conn
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: us-central1-docker.pkg.dev/climax-prod/climax-repo/api:latest
        resources:
          limits:
            cpu: "2000m"
            memory: "2Gi"
        ports:
        - containerPort: 8000
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
