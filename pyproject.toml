[project]
name = "climax"
version = "0.1.0"
description = "ClimaX — Federated AI Environmental Intelligence & Action Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ClimaX Architecture Team", email = "architecture@climax.dev" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.111.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "geoalchemy2>=0.15.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "shapely>=2.0.4",
    "alembic>=1.13.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.3",
    "google-cloud-pubsub>=2.21.0",
    "google-cloud-storage>=2.16.0",
    "google-auth>=2.29.0",
    "earthengine-api>=1.0.0",
    "jsonschema>=4.22.0",
    "prometheus-client>=0.20.0",
    "redis>=5.0.0",
    "google-generativeai>=0.7.2",
]

[project.optional-dependencies]
ai = [
    "google-generativeai>=0.5.4",
    "google-cloud-aiplatform>=1.51.0",
    "earthengine-api>=0.1.400",
    "pillow>=10.3.0",
]
gcp = [
    "google-cloud-storage>=2.16.0",
    "google-cloud-pubsub>=2.21.1",
    "google-cloud-bigquery>=3.22.0",
]
dev = [
    "ruff>=0.4.4",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["apps/api", "."]
asyncio_mode = "auto"
markers = [
    "integration: requires a running PostgreSQL/PostGIS database",
]
